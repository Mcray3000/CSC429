name: Quick Check

on:
  push:
    branches: [ main, develop ]

jobs:
  quick-test:
    name: Quick Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run quick tests
      run: |
        pytest tests/test_models.py tests/test_config.py -v

    - name: Check imports
      run: |
        python -c "from src.models.mlp import MLP; print('Imports work')"
        python -c "from src.federated.server import FederatedServer; print('Server imports')"
        python -c "from src.federated.client import FederatedClient; print('Client imports')"
